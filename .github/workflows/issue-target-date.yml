name: Issue target date on close (reusable)

# 이 파일도 kb-say-young/.github 리포에만 존재하는 재사용 가능한 워크플로입니다.
# 각 저장소의 caller 워크플로가 uses: 로 호출해야 동작합니다.
#
# "Target date"는 Projects v2 필드가 아니라 조직 레벨 Issue Field라서,
# 프로젝트 아이템을 거치지 않고 이슈에 직접 updateIssueFieldValue로 값을 씁니다.

on:
  workflow_call:
    secrets:
      PROJECTS_TOKEN:
        required: false
        description: "Issue field 값 수정 권한이 있는 fine-grained PAT"

jobs:
  set-target-date:
    runs-on: ubuntu-latest
    steps:
      - name: Set Target date issue field to close date
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const issueNodeId = context.payload.issue.node_id;
            const closedAt = context.payload.issue.closed_at; // ISO 8601
            const closeDate = closedAt.slice(0, 10); // YYYY-MM-DD

            // 조직의 Issue Field 목록에서 이름이 "Target date"인 날짜 필드를 찾음
            const fieldsResult = await github.graphql(`
              query($org: String!) {
                organization(login: $org) {
                  issueFields(first: 100) {
                    nodes {
                      ... on IssueFieldDate {
                        id
                        name
                      }
                    }
                  }
                }
              }
            `, { org: context.repo.owner });

            const fields = fieldsResult.organization.issueFields.nodes.filter(n => n && n.id);
            const targetDateField = fields.find(f => f.name.toLowerCase() === "target date");
            if (!targetDateField) {
              core.warning('조직에 "Target date"라는 이름의 날짜 Issue Field를 찾을 수 없습니다. 필드명을 확인해주세요.');
              return;
            }

            await github.graphql(`
              mutation($issueId: ID!, $fieldId: ID!, $date: String!) {
                updateIssueFieldValue(input: {
                  issueId: $issueId,
                  issueField: { fieldId: $fieldId, dateValue: $date }
                }) { clientMutationId }
              }
            `, { issueId: issueNodeId, fieldId: targetDateField.id, date: closeDate });
