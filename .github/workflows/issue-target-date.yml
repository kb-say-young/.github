name: Issue target date on close

# 이슈가 닫힐 때: 프로젝트의 "Target date" 필드를 닫힌 날짜로 채웁니다.
# 기존 파일은 건드리지 않는 별도 워크플로입니다.

on:
  issues:
    types: [closed]

jobs:
  set-target-date:
    runs-on: ubuntu-latest
    if: ${{ vars.PROJECT_ID != '' && secrets.PROJECTS_TOKEN != '' }}
    steps:
      - name: Set Target date field to close date
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const projectId = "${{ vars.PROJECT_ID }}";
            const targetDateFieldId = "${{ vars.TARGET_DATE_FIELD_ID }}";
            if (!targetDateFieldId) {
              core.warning("TARGET_DATE_FIELD_ID 리포지토리 변수가 설정되지 않았습니다.");
              return;
            }
            const issueNodeId = context.payload.issue.node_id;
            const closedAt = context.payload.issue.closed_at; // ISO 8601
            const closeDate = closedAt.slice(0, 10); // YYYY-MM-DD

            // 이슈가 속한 프로젝트 아이템 id 조회
            const itemsResult = await github.graphql(`
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes { id project { id } }
                    }
                  }
                }
              }
            `, { issueId: issueNodeId });

            const items = itemsResult.node.projectItems.nodes;
            const item = items.find(i => i.project.id === projectId);
            if (!item) {
              core.warning("이 이슈가 대상 프로젝트에 속해있지 않아 Target date를 설정할 수 없습니다.");
              return;
            }

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $date: Date!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                  value: { date: $date }
                }) { projectV2Item { id } }
              }
            `, { projectId, itemId: item.id, fieldId: targetDateFieldId, date: closeDate });
