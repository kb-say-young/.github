name: Issue target date on close (reusable)

# 이 파일도 kb-say-young/.github 리포에만 존재하는 재사용 가능한 워크플로입니다.
# 각 저장소의 caller 워크플로가 uses: 로 호출해야 동작합니다.

on:
  workflow_call:
    secrets:
      PROJECTS_TOKEN:
        required: false
        description: "Projects(v2) 필드 수정 권한이 있는 fine-grained PAT"

jobs:
  set-target-date:
    runs-on: ubuntu-latest
    if: ${{ vars.PROJECT_ID != '' }}
    steps:
      - name: Set Target date field to close date
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const projectId = "${{ vars.PROJECT_ID }}";
            const issueNodeId = context.payload.issue.node_id;
            const closedAt = context.payload.issue.closed_at; // ISO 8601
            const closeDate = closedAt.slice(0, 10); // YYYY-MM-DD

            // 이슈가 속한 프로젝트 아이템 id 조회
            const itemsResult = await github.graphql(`
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes { id project { id } }
                    }
                  }
                }
              }
            `, { issueId: issueNodeId });

            const items = itemsResult.node.projectItems.nodes;
            const item = items.find(i => i.project.id === projectId);
            if (!item) {
              core.warning("이 이슈가 대상 프로젝트에 속해있지 않아 Target date를 설정할 수 없습니다.");
              return;
            }

            // "Target date" 필드를 이름으로 직접 조회해 id를 얻음 (변수로 따로 관리하지 않음)
            const fieldResult = await github.graphql(`
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    field(name: "Target date") {
                      ... on ProjectV2FieldCommon { id }
                    }
                  }
                }
              }
            `, { projectId });
            const targetDateField = fieldResult.node.field;
            if (!targetDateField) {
              core.warning('프로젝트에 "Target date"라는 이름의 필드를 찾을 수 없습니다. 필드명을 확인해주세요.');
              return;
            }

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $date: Date!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                  value: { date: $date }
                }) { projectV2Item { id } }
              }
            `, { projectId, itemId: item.id, fieldId: targetDateField.id, date: closeDate });
